<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSMP // FEDERATION ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090a0c;
      --bg-card: #121418;
      --bg-panel: #181b20;
      --border-color: #2a2f38;
      --text-main: #e2e8f0;
      --text-muted: #8b949e;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-yellow: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(rgba(42, 47, 56, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 47, 56, 0.25) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.12),
        rgba(0, 0, 0, 0.12) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 999;
    }

    header {
      border-bottom: 1px solid var(--border-color);
      background: rgba(9, 10, 12, 0.9);
      backdrop-filter: blur(8px);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .fed-logo {
      width: 40px;
      height: 40px;
      border: 2px solid var(--text-main);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.2rem;
      position: relative;
    }

    .fed-logo::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--accent-red);
      top: -4px;
      right: -4px;
    }

    h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .sys-status {
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border-color);
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .blink-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .controls {
      max-width: 1300px;
      margin: 2rem auto 1.5rem;
      padding: 0 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem 1rem 0.75rem 2.2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-blue);
    }

    .search-box::before {
      content: ">";
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-blue);
      font-weight: bold;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--text-main);
      color: var(--bg-dark);
      border-color: var(--text-main);
      font-weight: 700;
    }

    .grid {
      max-width: 1300px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
      perspective: 1000px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1rem;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease-out, box-shadow 0.2s ease, border-color 0.2s;
      transform-style: preserve-3d;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      border-color: var(--text-main);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .card-glare {
      opacity: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .status-badge {
      padding: 2px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid;
    }

    .status-active { color: var(--accent-green); border-color: var(--accent-green); }
    .status-missing { color: var(--accent-yellow); border-color: var(--accent-yellow); }
    .status-threat { color: var(--accent-red); border-color: var(--accent-red); }

    .card-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 4.2;
      background: #0d0f12;
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 0.85rem;
      display: grid;
      place-items: center;
    }

    .card-image-wrap img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: contrast(1.05);
      transition: transform 0.3s ease;
    }

    .card:hover .card-image-wrap img {
      transform: scale(1.06);
    }

    .stamp {
      position: absolute;
      bottom: 10px;
      right: 10px;
      border: 2px solid var(--accent-red);
      color: var(--accent-red);
      background: rgba(9, 10, 12, 0.85);
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      transform: rotate(-6deg);
      text-transform: uppercase;
    }

    .stamp.fed {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .card-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lang-badge {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-desc {
      font-size: 0.8rem;
      line-height: 1.45;
      color: #cbd5e1;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      border-top: 1px dashed var(--border-color);
      padding-top: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .barcode {
      letter-spacing: 2px;
      font-weight: 700;
      opacity: 0.6;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      place-items: center;
      padding: 1.5rem;
      z-index: 500;
    }

    .modal-overlay.open {
      display: grid;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--text-main);
      max-width: 720px;
      width: 100%;
      padding: 2rem;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .close-modal:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    @media (max-width: 620px) {
      .modal-grid { grid-template-columns: 1fr; }
    }

    .modal-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      image-rendering: pixelated;
      background: #0d0f12;
      border: 1px solid var(--border-color);
    }

    .modal-stats {
      margin-top: 1rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
      font-size: 0.8rem;
      display: grid;
      gap: 0.4rem;
    }

    .stat-row span {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <div class="fed-logo">F</div>
        <div>
          <h1>QSMP // FEDERATION ARCHIVE</h1>
          <div class="subtitle">ISLAND SURVEILLANCE DATABASE // CLEARANCE LEVEL 4</div>
        </div>
      </div>
      <div class="sys-status">
        <div class="blink-dot"></div>
        <span>SYSTEM ONLINE // FILES: <strong id="card-count">0</strong></span>
      </div>
    </div>
  </header>

  <section class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="SEARCH_SUBJECT_OR_EGG...">
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">WSZYSTKIE</button>
      <button class="filter-btn" data-filter="resident">MIESZKAŃCY</button>
      <button class="filter-btn" data-filter="egg">JAJA (EGGS)</button>
      <button class="filter-btn" data-filter="federation">FEDERACJA</button>
    </div>
  </section>

  <main class="grid" id="cardsGrid"></main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="close-modal" id="closeModal">[X] ZAMKNIJ</button>
      <div style="font-size: 0.75rem; color: var(--accent-blue);" id="modalFileId">FILE // #000</div>
      <h2 class="card-title" style="font-size: 1.8rem; margin-top: 0.2rem;" id="modalTitle">NAME</h2>
      
      <div class="modal-grid">
        <img src="" alt="" class="modal-img" id="modalImg">
        <div>
          <p style="font-size: 0.85rem; line-height: 1.6; color: #cbd5e1;" id="modalFullDesc"></p>
          <div class="modal-stats">
            <div class="stat-row"><span>SEKTOR / JĘZYK:</span> <strong id="modalLang"></strong></div>
            <div class="stat-row"><span>POWIĄZANIA:</span> <strong id="modalRelation"></strong></div>
            <div class="stat-row"><span>STATUS AKTUALNY:</span> <strong id="modalStatus"></strong></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cardsData = [
      {
        id: "FILE // #050",
        name: "Ewron",
        category: "resident",
        lang: "🇵🇱 [PL]",
        status: "ACTIVE",
        statusClass: "status-active",
        stamp: "MONITORED",
        stampClass: "",
        relation: "Polska Sekcja QSMP",
        image: "ewron.jpeg",
        shortDesc: "Przedstawiciel polskiej społeczności na wyspie. Znany z niespożytej energii i budowania baz.",
        fullDesc: "Aktywny uczestnik wydarzeń na QSMP. Wprowadził polską energię i kulturę w struktury wyspy, angażując się w projekty budowlane oraz interakcje z innymi międzynarodowymi mieszkańcami."
      },
      {
        id: "FILE // #051",
        name: "Graf",
        category: "resident",
        lang: "🇵🇱 [PL]",
        status: "ACTIVE",
        statusClass: "status-active",
        stamp: "OBSERVED",
        stampClass: "",
        relation: "Polska Sekcja QSMP",
        image: "graf.jpeg",
        shortDesc: "Członek polskiej ekipy, ostrożny analityk i budowniczy.",
        fullDesc: "Przezornie podchodzi do tajemnic Federacji. Skupiony na przetrwaniu, rozwoju technologicznym i wspieraniu polskiej grupy na serwerze."
      },
      {
        id: "FILE // #052",
        name: "Nexe",
        category: "resident",
        lang: "🇵🇱 [PL]",
        status: "ACTIVE",
        statusClass: "status-active",
        stamp: "REGISTERED",
        stampClass: "",
        relation: "Polska Sekcja QSMP",
        image: "nexe.jpeg",
        shortDesc: "Ekspert od technicznych aspektów gry i eksploracji wyspy.",
        fullDesc: "Jeden z filarów polskiej grupy na serwerze QSMP. Cechuje się doskonałą znajomością mechanik gry oraz kreatywnym podejściem do przetrwania w niebezpiecznym środowisku."
      },
      {
        id: "FILE // #053",
        name: "Multi",
        category: "resident",
        lang: "🇵🇱 [PL]",
        status: "ACTIVE",
        statusClass: "status-active",
        stamp: "VERIFIED",
        stampClass: "",
        relation: "Polska Sekcja QSMP",
        image: "youngmulti.jpeg",
        shortDesc: "Weteran polskiej sceny gamingowej, obecnie stawiający czoła zagrożeniom QSMP.",
        fullDesc: "Wniósł na wyspę duże doświadczenie z serwerów przetrwania. Szybko odnalazł się w dynamice panującej między międzynarodowymi graczami a Federacją."
      },
      {
        id: "FILE // #001",
        name: "Cucurucho",
        category: "federation",
        lang: "[ALL / BINARY]",
        status: "ACTIVE",
        statusClass: "status-threat",
        stamp: "ADMINISTRATION",
        stampClass: "fed",
        relation: "The Federation",
        image: "https://placehold.co/400x420/14161a/ffffff?text=CUCURUCHO",
        shortDesc: "Główny egzekutor woli Federacji na wyspie Quesadilla. Zawsze obserwuje.",
        fullDesc: "Podmiot najwyższego szczebla administracyjnego. Odpowiada za utrzymanie porządku, testy psychologiczne oraz nadzorowanie wszystkich mieszkańców bez wyjątku."
      },
      {
        id: "FILE // #012",
        name: "Philza",
        category: "resident",
        lang: "[EN]",
        status: "ACTIVE",
        statusClass: "status-active",
        stamp: "OBSERVED",
        stampClass: "",
        relation: "Chayanne, Tallulah",
        image: "https://placehold.co/400x420/14161a/10b981?text=PHILZA",
        shortDesc: "Doświadczony wojownik i niezwykle opiekuńczy strażnik jaj.",
        fullDesc: "Jeden z najgroźniejszych mieszkańców wyspy w bezpośrednim starciu. Aktywnie poszukuje luk w systemie zabezpieczeń Federacji."
      }
    ];

    const grid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const cardCount = document.getElementById('card-count');

    let currentFilter = 'all';

    function renderCards() {
      const query = searchInput.value.toLowerCase();
      grid.innerHTML = '';

      const filtered = cardsData.filter(card => {
        const matchesFilter = currentFilter === 'all' || card.category === currentFilter;
        const matchesSearch = card.name.toLowerCase().includes(query) || 
                              card.relation.toLowerCase().includes(query) ||
                              card.id.toLowerCase().includes(query) ||
                              card.lang.toLowerCase().includes(query);
        return matchesFilter && matchesSearch;
      });

      cardCount.textContent = filtered.length;

      filtered.forEach(card => {
        const el = document.createElement('article');
        el.className = 'card';
        el.innerHTML = `
          <div class="card-glare"></div>
          <div>
            <div class="card-header">
              <span>${card.id}</span>
              <span class="status-badge ${card.statusClass}">${card.status}</span>
            </div>
            <div class="card-image-wrap">
              <img src="${card.image}" alt="${card.name}" loading="lazy">
              <div class="stamp ${card.stampClass}">${card.stamp}</div>
            </div>
            <h2 class="card-title">${card.name}</h2>
            <div class="card-meta">
              <span class="lang-badge">${card.lang}</span>
              <span>CAT: ${card.category.toUpperCase()}</span>
            </div>
            <p class="card-desc">${card.shortDesc}</p>
          </div>
          <div class="card-footer">
            <span>CLICK TO DECRYPT</span>
            <span class="barcode">|| | ||| | ||</span>
          </div>
        `;

        el.addEventListener('mousemove', (e) => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -7;
          const rotateY = ((x - centerX) / centerX) * 7;

          el.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          const glare = el.querySelector('.card-glare');
          glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.12), transparent 65%)`;
        });

        el.addEventListener('mouseleave', () => {
          el.style.transform = 'rotateX(0) rotateY(0) scale(1)';
        });

        el.addEventListener('click', () => openModal(card));

        grid.appendChild(el);
      });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCards();
      });
    });

    searchInput.addEventListener('input', renderCards);

    const modalOverlay = document.getElementById('modalOverlay');
    const closeModal = document.getElementById('closeModal');

    function openModal(card) {
      document.getElementById('modalFileId').textContent = `${card.id} // CLASSIFIED DOSSIER`;
      document.getElementById('modalTitle').textContent = card.name;
      document.getElementById('modalImg').src = card.image;
      document.getElementById('modalFullDesc').textContent = card.fullDesc;
      document.getElementById('modalLang').textContent = card.lang;
      document.getElementById('modalRelation').textContent = card.relation;
      document.getElementById('modalStatus').textContent = card.status;
      modalOverlay.classList.add('open');
    }

    closeModal.addEventListener('click', () => modalOverlay.classList.remove('open'));
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('open');
    });

    renderCards();
  </script>
</body>
</html>
